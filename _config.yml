# Site Settings
locale                   : "en-US"
title                    : "Dr. Selim C. Hotinli"
title_separator          : "-"
name                     : &name "Selim C. Hotinli"
description              : &description "P. J. E. Peebles Fellow at Perimeter Institute for Theoretical Physics"
url                      : https://selimhotinli.github.io
baseurl                  : ""
repository               : "selimhotinli.github.io"
breadcrumbs              : false

atom_feed:
  path                   : # blank (default) uses feed.xml

# Site Author
author:
  name             : "Selim C. Hotinli"
  avatar           : "selims.jpeg"
  bio              : "P. J. E. Peebles Fellow"
  employer         : "Perimeter Institute"
  googlescholar    : "https://scholar.google.com/citations?user=jFgpKboAAAAJ&hl=en"
  email            : "selimcanhotinli@gmail.com"
  github           : "selimhotinli"


# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from


# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
