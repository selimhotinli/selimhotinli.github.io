{% include base_path %}

<!-- start custom head snippets -->

<!-- Google Fonts: Inter (body + headings) and JetBrains Mono (code) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- Academicons: icon font for academic profile links (Google Scholar, ORCID, etc.) -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<style>
  /* Responsive video wrapper */
  .video-responsive {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    max-width: 100%;
    margin-bottom: 1.3em;
  }
  .video-responsive iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 4px;
  }

  /* Hero section (homepage) */
  .hero-section {
    margin-bottom: 1.5em;
    padding-bottom: 1.5em;
    border-bottom: 1px solid #30363d;
  }
  .hero-name {
    font-size: 2em;
    font-weight: 700;
    margin: 0 0 0.3em;
    line-height: 1.1;
    color: #e6edf3;
  }
  .hero-tagline {
    font-size: 1.1em;
    color: #20c997;
    margin: 0 0 0.4em;
    line-height: 1.4;
    font-weight: 400;
  }
  .hero-position {
    font-size: 0.95em;
    color: #8b949e;
    margin: 0;
  }

  /* Navigation cards (homepage) */
  .nav-cards {
    display: flex;
    gap: 1em;
    margin-top: 2em;
  }
  .nav-card {
    flex: 1;
    display: block;
    padding: 1.2em;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    text-decoration: none !important;
    color: #e6edf3 !important;
    transition: border-color 0.2s ease, transform 0.2s ease;
    position: relative;
  }
  .nav-card:hover {
    border-color: #20c997;
    transform: translateY(-2px);
  }
  .nav-card h3 {
    margin: 0 0 0.4em;
    font-size: 1em;
    font-weight: 600;
    color: #20c997;
  }
  .nav-card p {
    margin: 0;
    font-size: 0.8em;
    color: #8b949e;
    line-height: 1.4;
  }
  .nav-card__arrow {
    position: absolute;
    top: 1.2em;
    right: 1.2em;
    color: #30363d;
    font-size: 1.1em;
    transition: color 0.2s ease;
  }
  .nav-card:hover .nav-card__arrow {
    color: #20c997;
  }

  /* Research page: in-page navigation */
  .research-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5em;
    margin: 1.5em 0 2em;
    padding-bottom: 1.5em;
    border-bottom: 1px solid #30363d;
  }
  .research-nav a {
    display: inline-block;
    padding: 0.4em 0.9em;
    font-size: 0.8em;
    color: #8b949e !important;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 20px;
    text-decoration: none !important;
    transition: all 0.2s ease;
  }
  .research-nav a:hover {
    color: #20c997 !important;
    border-color: #20c997;
  }

  /* Research page: figure captions */
  .research-block__caption {
    font-size: 0.75em;
    color: #8b949e;
    margin-top: 0.5em;
    line-height: 1.4;
  }

  /* Smooth anchor scrolling with header offset */
  [id].research-section {
    scroll-margin-top: 80px;
  }

  /* Research page: image sizing classes */
  .img-full {
    max-width: 100%;
    width: 100%;
    height: auto;
    border-radius: 4px;
  }
  .img-wide {
    max-width: 800px;
    width: 100%;
    height: auto;
    border-radius: 4px;
  }
  .img-medium {
    max-width: 700px;
    width: 100%;
    height: auto;
    border-radius: 4px;
  }
  .img-small {
    max-width: 550px;
    width: 100%;
    height: auto;
    border-radius: 4px;
  }

  /* Research page: side-by-side figures */
  .fig-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin: 1em 0;
  }
  .fig-row img,
  .fig-row video {
    height: auto;
    border-radius: 4px;
    min-width: 0;
  }
  .fig-row--videos video:first-child { width: 20%; }
  .fig-row--videos video:last-child { width: 78%; }
  .fig-row--60-40 img:first-child { width: 52%; }
  .fig-row--60-40 img:last-child { width: 45%; }
  .fig-row--half img { width: calc(50% - 5px); }
  .fig-row--40-30 img:first-child { width: 55%; }
  .fig-row--40-30 img:last-child { width: 42%; }

  /* Research page: section styling */
  .research-section {
    margin-top: 2.5em;
    padding-top: 1.5em;
    border-top: 1px solid #30363d;
  }
  .research-section h2 {
    color: #20c997;
    border-bottom: none;
    font-size: 1.3em;
    margin-top: 0;
  }
  .research-intro {
    color: #8b949e;
    font-size: 0.95em;
    font-style: italic;
    margin-bottom: 1.5em;
    line-height: 1.6;
  }

  /* Section variant: no top border */
  .research-section--flush {
    border-top: none;
    margin-top: 1em;
    padding-top: 0;
  }

  /* Cosmic Ecosystems: speaker grid */
  .speaker-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.3em 1.5em;
    margin-bottom: 1.5em;
  }
  .speaker-grid span {
    font-size: 0.85em;
    color: #8b949e;
    padding: 0.25em 0;
  }

  /* Moving Lens Effect page: hero eyebrow (sits above tagline in .hero-section) */
  .hero-eyebrow {
    font-size: 0.75em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #20c997;
    margin: 0 0 0.6em;
  }
  .hero-eyebrow a {
    color: #20c997 !important;
    text-decoration: none !important;
    border-bottom: 1px dotted rgba(32, 201, 151, 0.6);
    transition: border-color 0.2s ease;
  }
  .hero-eyebrow a:hover {
    border-bottom-color: #20c997;
  }

  /* Page-intro variant: small top margin so the hero block clears
     the auto-rendered .page__title on archive-layout pages. */
  .hero-section--page-intro {
    margin-top: 1em;
  }

  /* Inline placeholder marker for to-be-filled-in text (numbers, survey names, etc.) */
  .placeholder-inline {
    font-style: italic;
    color: #7d8590;
    border-bottom: 1px dashed #30363d;
    padding: 0 0.1em;
  }

  /* Figure placeholder block — dashed box, used until paper figure is dropped in */
  .figure-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 240px;
    max-width: 800px;
    width: 100%;
    margin: 1em 0 0.5em;
    padding: 2em;
    background: #0d1117;
    border: 1px dashed #30363d;
    border-radius: 4px;
    text-align: center;
  }
  .figure-placeholder__label {
    font-size: 0.7em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #20c997;
    margin-bottom: 0.6em;
  }
  .figure-placeholder__detail {
    font-size: 0.85em;
    color: #8b949e;
    line-height: 1.5;
  }
  .figure-placeholder__detail code {
    font-size: 0.95em;
    color: #c9d1d9;
    background: #161b22;
    padding: 0.1em 0.4em;
    border-radius: 3px;
  }

  /* CV page: timeline entries */
  .cv-entry {
    display: flex;
    gap: 1.2em;
    margin-bottom: 1.2em;
    padding-bottom: 1.2em;
    border-bottom: 1px solid #21262d;
  }
  .cv-entry__date {
    flex: 0 0 110px;
    font-size: 0.8em;
    color: #8b949e;
    padding-top: 0.15em;
  }
  .cv-entry__content {
    flex: 1;
  }
  .cv-entry__content strong {
    color: #e6edf3;
  }
  .cv-entry__detail {
    font-size: 0.85em;
    color: #8b949e;
  }

  /* Timeline variant: highlight the most recent / current entry in teal */
  .cv-entry--current .cv-entry__date,
  .cv-entry--current .cv-entry__content strong {
    color: #20c997;
  }

  @media (max-width: 600px) {
    .nav-cards { flex-direction: column; }
    .hero-name { font-size: 1.6em; }
    .research-block,
    .research-block--reverse {
      flex-direction: column;
    }
    .research-block__figure {
      flex: none;
      max-width: 100%;
    }
    .fig-row { flex-direction: column; }
    .cv-entry { flex-direction: column; gap: 0.3em; }
    .cv-entry__date { flex: none; }
    .speaker-grid { grid-template-columns: 1fr; }
    .fig-row img, .fig-row video { max-width: 100% !important; flex: none !important; }
    .research-nav { gap: 0.4em; }
  }
</style>

<!-- end custom head snippets -->
